# Parameter pools for seeded corpus generation.
#
# No concrete payload string is hardcoded anywhere in this repository: every surface string is
# assembled from these pools by a seeded RNG (spec 05 section 8). Changing the seed changes every
# rendered string while preserving the taxonomy, which is what lets each release vary its surface
# strings without changing what is being tested.
#
# SAFETY NOTES
#  * All exfiltration destinations use the reserved, permanently-unroutable `.example` and
#    `.invalid` TLDs (RFC 2606 / RFC 6761) and structurally invalid IBANs. Nothing here can
#    reach a real mailbox or bank account.
#  * All companies, banks and people are invented.

