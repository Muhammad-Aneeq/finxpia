[project]
name = "finxpia"
version = "0.1.0"
description = "Finance-document prompt-injection (XPIA) corpus with a co-equal benign twin corpus, delivered as a Promptfoo dataset and a PyRIT dataset. Defensive security tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "FinXPIA" }]
keywords = ["prompt-injection", "xpia", "owasp-llm01", "red-team", "finance", "promptfoo", "pyrit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
pyrit = ["pyrit>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
finxpia = "finxpia.cli:app"

[project.urls]
Homepage = "https://github.com/aneeq-labs/finxpia"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finxpia"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer requires `typer.Option(...)` / `typer.Argument(...)` calls in argument defaults; B008
# flags that pattern generically, so it is only disabled for the CLI module.
"src/finxpia/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["finxpia"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q --strict-markers"
markers = [
  "packaging: end-to-end packaging smoke tests that invoke real external tools",
  "live: requires OPENAI_API_KEY",
]
